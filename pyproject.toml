[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "handdrawn-ocsr"
version = "0.1.0"
description = "Student-scale hand-drawn optical chemical structure recognition study"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<2.4",
  "pandas>=2.2,<3",
  "Pillow>=11,<12",
  "PyYAML>=6,<7",
  "rdkit>=2026.3,<2027",
  "torch>=2.6,<2.7",
  "torchvision>=0.21,<0.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest_tmp -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
